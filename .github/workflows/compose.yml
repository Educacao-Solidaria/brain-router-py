name: Compose

# O docker-compose.yml de ponta a ponta, sem publicar nada (a imagem fica no runner): pgvector
# criado na inicialização, migração na partida do RAG, /healthz com o banco e sem ele, dados no
# volume depois de `down`/`up` e o RAG saindo com 0. Em todo PR: depende da imagem e do pacote.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: compose (rag + postgres com pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      # A imagem do serviço `rag`, com as camadas do cache do Actions que o workflow Docker grava.
      - name: Build da imagem do rag
        uses: docker/build-push-action@v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          BUILDX_METADATA_PROVENANCE: disabled
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: educacao-solidaria/brain-router:dev
          cache-from: type=gha

      # O fluxo do README, com senha nova (mascarada); a chave fica no marcador: nada chama a API.
      - name: .env a partir do .env.example
        shell: bash
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          sed 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD='"$password"'/' .env.example > .env

      # Uma falha não esconde as outras: cada conferência anota a sua e o passo sai 1 no fim.
      - name: Contrato do compose (pgvector, migração, /healthz com o banco, volume e desligamento)
        shell: bash
        run: |
          fail=0; problem() { echo "::error::$1"; fail=1; }
          sql() { docker compose exec -T db psql -U brain -d brain -tAc "$1"; }
          healthz() {  # até 30 s pelo status ($1) e pelo trecho do corpo ($2)
            for _ in $(seq 30); do
              got=$(curl -s --max-time 3 -w ' %{http_code}' http://127.0.0.1:8000/healthz) || got=""
              [[ "$got" == *"$2"*" $1" ]] && { echo "/healthz: $got"; return 0; }
              sleep 1
            done
            echo "/healthz: ${got:-sem resposta}"; return 1
          }
          up() { docker compose up -d --wait --wait-timeout 120 --no-build "$@"; }

          up || problem "o compose não ficou saudável"
          docker compose ps
          running=$(docker compose ps --services | sort | paste -sd ' ')
          [ "$running" = "db rag" ] || problem "serviços no ar: '$running' (esperado: db rag)"
          ports=$(docker port "$(docker compose ps -q rag)") || true
          [ "$ports" = "8000/tcp -> 127.0.0.1:8000" ] || problem "rag publicado em '$ports'"
          ports=$(docker port "$(docker compose ps -q db)") || true
          [ -z "$ports" ] || problem "o banco foi publicado no host: '$ports'"
          healthz 200 '"checks":{"postgres":"ok"}' || problem "/healthz do rag sem o banco ok"
          version=$(sql "SELECT version_num FROM alembic_version") || true
          [ "$version" = 0004_report_indexes ] || problem "o rag não migrou ao subir: '$version'"
          ext=$(sql "SELECT string_agg(extname, ',' ORDER BY extname) FROM pg_extension
                     WHERE extname IN ('vector', 'pg_trgm')") || true
          [ "$ext" = pg_trgm,vector ] || problem "extensões depois do initdb: '$ext'"
          distance=$(sql "SELECT '[1,2,3]'::vector <-> '[1,2,5]'::vector") || true
          [ "$distance" = 2 ] || problem "distância do pgvector: '$distance' (esperado: 2)"
          sql "CREATE TABLE ci_marker AS SELECT 'persistiu'::text AS v" || problem "marcador"

          docker compose stop db
          healthz 503 '"checks":{"postgres":"down"}' || problem "/healthz sem 503 com o banco parado"
          up db || problem "o banco não voltou"
          healthz 200 '"checks":{"postgres":"ok"}' || problem "o rag não voltou a ver o banco"

          docker compose down
          up || problem "o compose não subiu de novo depois do down"
          marker=$(sql "SELECT v FROM ci_marker") || true
          [ "$marker" = persistiu ] || problem "o dado não sobreviveu ao down/up (volume pg-data)"

          docker compose stop rag  # SIGTERM; depois de 10 s, SIGKILL (saída 137)
          code=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq rag)") || true
          echo "saída do rag depois do SIGTERM: $code"
          [ "$code" = 0 ] || problem "o SIGTERM não encerrou o rag com 0 (saída $code)"
          docker compose logs --no-color rag | tail -n 15

          docker compose --profile test up -d --wait --wait-timeout 120 db-test ||
            problem "o db-test (perfil test) não ficou saudável"
          ports=$(docker port "$(docker compose --profile test ps -q db-test)") || true
          [ "$ports" = "5432/tcp -> 127.0.0.1:5432" ] || problem "db-test publicado em '$ports'"
          exit "$fail"

      - name: Logs do compose
        if: ${{ failure() }}
        shell: bash
        run: docker compose --profile test logs --no-color | tail -n 120
