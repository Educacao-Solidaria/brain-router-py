# Ambiente local do RAG: a API (`rag`, a imagem do Dockerfile) e o Postgres com pgvector (`db`),
# com os nomes, as variáveis e o volume do compose do ecossistema (contrato da Fase 5, §4).
#   cp .env.example .env          # preencha POSTGRES_PASSWORD; sem ela o banco não inicializa
#   docker compose up -d --wait --build   # a imagem do código atual; o rag espera o banco
#   curl -fsS http://127.0.0.1:8000/healthz   # {"status":"ok","checks":{"postgres":"ok"}}
#   docker compose down           # os dados ficam no volume pg-data; `down -v` os apaga
# Segredos só pelo .env (fora do git), interpolados aqui. O banco não é publicado no host.
services:
  db:
    # pgvector 0.8.7 sobre o PostgreSQL 17.11 (bookworm), a tag `pg17` em 22/10/2026 e a mesma
    # imagem dos jobs do CI, fixada pelo digest do índice multi-arquitetura.
    image: &pgvector pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: brain
      POSTGRES_DB: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data # o PGDATA (e o VOLUME) da imagem pg17
      # Só na 1ª partida (diretório de dados vazio), como o superusuário, no banco `brain`.
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Pelo TCP: na 1ª partida o initdb roda num servidor só de socket unix, e o pg_isready pelo
      # socket daria o banco como pronto antes de as extensões existirem.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "brain", "-d", "brain"]
      interval: 5s
      timeout: 5s
      retries: 10

  rag:
    build: .
    image: educacao-solidaria/brain-router:dev
    # A fábrica que lê Settings e põe o banco no /healthz (o CMD da imagem sobe sem banco).
    command: ["uvicorn", "app.api.server:create_server", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://brain:${POSTGRES_PASSWORD}@db:5432/brain
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    ports:
      - "127.0.0.1:8000:8000" # a API não tem autenticação: só o loopback do host
    depends_on:
      db:
        condition: service_healthy
    # Como no workflow Docker: raiz somente leitura, sem capabilities nem escalada de privilégio.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Testes de integração no host (README): `docker compose --profile test up -d --wait db-test`.
  # Descartável como o service do job `integration` do CI: sem o initdb (a migração 0001 cria as
  # extensões), dados em tmpfs (somem com o container) e porta só no loopback. Senha de teste.
  db-test:
    profiles: [test]
    image: *pgvector
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain-local
      POSTGRES_DB: brain_router_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "brain", "-d", "brain_router_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg-data:
