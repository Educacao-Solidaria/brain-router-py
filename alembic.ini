# Alembic: `uv run alembic upgrade head` aplica as migrações.
# A URL do banco NÃO fica aqui: o env.py a lê de DATABASE_URL (app.settings), que é segredo.
# Logging vem do structlog (app.log), por isso este arquivo não tem seções [loggers].

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
path_separator = os
